- title: 為什麼十年後還要提出開放資料倡議？
  subtitle: 2026 年 6 月號
  description: 這十年裡，資料被放上平台，也被民間社群做出公共價值。但到了 2026 年，欄位不清、格式不一、授權不明、更新不穩等問題仍讓使用者和公務員一起消耗。OCF 提出 2026-2036 開放資料倡議，要求下一階段把授權、治理、開放、應用和回饋一起處理。
  link: https://ocf.neticrm.tw/civicrm/mailing/view?reset=1&id=396
  cover: /p/newspaper/epaper202606.png

- title: 公民團體遭攻擊創新高，如何完善基礎防護？
  subtitle: 2026 年 7 月號
  description: Cloudflare 最新公布的 Project Galileo 報告顯示，去年針對公民社會組織的數位攻擊頻率是一般網站的七倍以上。攻擊高峰經常瞄準調查報告發布、倡議活動期間或選舉前後，往往發生在 NGO 最需要被聽見的時刻。
  link: https://ocf.neticrm.tw/civicrm/mailing/view?reset=1&id=398
  cover: /p/newspaper/epaper202607.png

