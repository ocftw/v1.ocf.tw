  description: 2023 年度，SITCON 夏令營將於國立陽明交通大學光復校區舉辦，這次以主題「開源文明，源力擴張」，帶各位一同進入開源宇宙，承接開源城的概念，配合豐富的課程、座談會及社群闖關，透過基礎的 Python 程式語言到做出自己的聊天機器人的實作課程，也有讓學員認識社群精神、開源文化、資訊安全等廣度課程，社群闖關讓學員藉由遊戲更加了解各個社群的理念、運作；為學員帶來前段提到的精彩活動，絕對能讓每一個人大開眼界。今年並將更進一步把故事和營隊整合，完整營造整體感，務求讓學員擁有截然不同的營隊體驗。
