- id:
  name: 學生計算機年會 SITCON 2025
  name_en: SITCON 2025
  description: 作為學生，我們處在一個迷惘卻充滿熱血的年紀，可以試圖去尋找社會中的裂隙，並透過「自我覺察」來建立屬於自己的價值觀與信念。無論是發掘在螢幕後方的我們，被社群媒體影響的同時遺漏了什麼；或是如何不為了合群或符合社會期待，而去隱藏自己的真實想法以此從眾；甚至是勇敢地成為先鋒，以資訊結合不同領域，打造出多元化的社群生態。讓我們帶著自我覺察的心，去開創一條屬於這個時代的逃逸路線。
  description_en: "SITCON 2025 invited students to use self-awareness to develop their own values and beliefs. It asked them to consider what they might miss when social media shapes their view of the world, and how the pressure to fit in can lead them to hide what they really think. It also encouraged them to bring computing together with other fields and help build a more diverse community."
  start: 2025/03/08
  end: 
  links:
    - title: 活動網頁
      url: https://sitcon.org/2025/
  links_en:
    - title: Event website
      url: https://sitcon.org/2025/
  cover_image: /p/sitcon/sitcon2025.png
  contributor_ids: 
  project_ids:
    - sitcon