- id:
  name: 學生計算機年會 SITCON 2024
  name_en: SITCON 2024
  description: 2024 年的社會仍然有各式問題需要解決：社群媒體審查機制、內容推薦演算法、科技綁架、個人資料追蹤、深度偽造技術、詐騙及假新聞、科技巨擘壟斷行為、⋯⋯。每個議題的複雜程度之高、涉及層面之廣，不禁讓我們思考：究竟科技發展會帶領我們到何方？
  description_en: "SITCON 2024 asked where technological development is taking us. Its introduction highlighted problems such as social media moderation, recommendation algorithms, dependence on technology, personal data tracking, deepfakes, scams, misinformation, and monopolistic practices by major tech companies."
  start: 2024/03/09
  end: 
  links:
    - title: 活動網頁
      url: https://sitcon.org/2024/
  links_en:
    - title: Event website
      url: https://sitcon.org/2024/
  cover_image: /p/sitcon/sitcon2024-1.png
  contributor_ids: 

  project_ids:
    - sitcon

- id:
  name: SITCON 夏令營 2024
  name_en: SITCON Camp 2024
  description: 今年 SITCON 夏令營將於陽明交通大學光復校區舉辦，以「拉麵加點 source，麵向開源界」為主軸。正如同拉麵的麵條和配料可以隨個人喜好自由搭配組合，在程式設計中也可以讓每個人根據自己的想法和需求，選用不同的程式模組和元件，打造獨一無二的作品。透過兩者結合，傳達開源及資訊的無限可能性，在動手實作的過程中，激發創意靈感，發掘個人興趣所在，進而體會開源的樂趣與價值。
  description_en: "SITCON Camp 2024 took place at National Yang Ming Chiao Tung University’s Guangfu campus. Its ramen-themed program compared choosing noodles and toppings to combining software modules and components. Through hands-on work, campers explored what open source makes possible and discovered what they wanted to learn next."
