name: FreeSEED 「台灣製造」大型語言模型計劃
name_en: "FreeSEED — Made-in-Taiwan Large Language Model Project"

description: 我們以 DeepSeek R1 為基礎，透過重新訓練與改善，打造出一個符合台灣需求的開放模型權重的大型語言模型。這個模型會專注於繁體中文與英文，讓它在這兩種語言的文字表現遠優於簡體中文，且具備民主價值。這不只是技術專案，更是文化與價值工程。
description_en: "FreeSEED builds on DeepSeek R1 to develop an open-weight language model tailored to Taiwan. The project focuses on improving performance in Traditional Chinese and English and on reflecting democratic values in how the model responds."

