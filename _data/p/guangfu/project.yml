name: 支持光復超人
name_en: "Support the Guangfu Volunteers"

description: 光復超人平台起源於 2025 年光復與馬太鞍溪洪災。在第一線，我們看到的不是沒有人願意幫忙，而是——資訊太亂、角色太多、沒有一個地方可以好好協作。於是，一群來自不同背景的志工，用最臨時、最克難的方式，把資訊、行動與人連在一起。

description_en: "The Guangfu Volunteers platform grew out of the 2025 flooding in Guangfu and along the Matai’an River. On the ground, many people wanted to help. Information was scattered, people were working in many different roles, and there was no shared place to coordinate. Volunteers from different backgrounds quickly put together a way to connect people, information, and relief efforts with the resources they had."

