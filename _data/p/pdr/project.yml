name: 配合政府執法，數位平臺該交出民眾資料嗎？
name_en: Should Digital Platforms Hand Over User Data for Law Enforcement?

description: 政府、平臺與公民權利的拉鋸。首份結合臺灣產業實務與政策對話的研究，盤點數位索資的實務挑戰與治理結構問題，並提出具體改革建議。
description_en: The tension between government, platforms, and civil rights. The first research report combining Taiwan's industry practices and policy dialogue on government data requests to digital platforms.

tagline: 政府、平臺與公民權利的拉鋸
tagline_en: The tension between government, platforms, and civil rights

