name: Twinkle AI
name_en: "Twinkle AI"

description: Twinkle AI 是一個以繁體中文為核心的開源 AI 社群，專注於打造在地語言模型與資料集。我們致力於推動可公開使用的模型權重、訓練資料與實務經驗分享，串聯研究者、工程師與創作者，促進台灣在地 AI 生態的交流與共創。
description_en: "Twinkle AI is an open-source AI community focused on Traditional Chinese. It brings together researchers, engineers, and creators to develop local language models and datasets and share model weights, training data, and practical experience."

