    icon: database
    title: 02 Open Government and Open Data
    description:
  - type: content
    single_column: true
    columns:
      - type: article
        alignment: left
        title: Data Should Not Be a Secret Locked on a Government Hard Drive
        description: |
          <p>Over the past year, OCF played the roles of advocate and educator. We worked inside institutions to advance legal foundations and also brought open culture into parliament and schools.</p>
          <div class="ocf2025-detail-grid">
            <section>
              <h3>Opening the center of power: building a smarter and more open government and parliament</h3>
              <p>As AI reshapes public decision-making, is the parliament that makes national laws ready? OCF continued to promote more transparent and digitally capable parliamentary and government operations, making open government more possible.</p>
              <ul>
                <li><strong>Guidelines for parliamentary use of AI:</strong> OCF worked with the Westminster Foundation for Democracy (WFD) to hold “When Parliament Meets AI: Launch of Guidelines for Parliamentary Use of AI” at the Legislative Yuan, discussing responsible AI use and how technology can safely support decision-making.</li>
                <li><strong>Reconnecting open parliament stakeholders:</strong> OCF and WFD held a closed-door discussion, “The Next Step for Open Parliament,” at the g0v community space, reconnecting the community and keeping open parliament commitments in conversation.</li>
                <li><strong>Turning action into dialogue:</strong> OCF served as a member of the Executive Yuan Open Government National Action Plan task force, continuing to bridge communication across ministries.</li>
                <li><strong>Embedding open government in public service:</strong> OCF helped the Ministry of Justice run training for Grade 9 ethics officers, bringing open government concepts into daily public-sector work.</li>
              </ul>
            </section>
            <section>
              <h3>Building open foundations: from legislation and collaboration to global connection</h3>
              <p>Open data needs strong legal foundations. OCF took part in policy consultations to make sure the law serves people and protects rights, not only technology.</p>
              <ul>
                <li><strong>Supporting inter-ministerial collaboration:</strong> OCF served on ministry-level open data advisory committees for the Veterans Affairs Council, Mainland Affairs Council, and Ministry of Culture, helping agencies develop practical open data practices in the AI era.</li>
                <li><strong>Legislative advocacy and impact assessment:</strong> OCF joined multiple civil society consultations and stakeholder meetings on the <a href="https://ocf.neticrm.tw/civicrm/mailing/view?reset=1&id=352">draft Act for Promoting Data Innovation and Use</a>, and provided professional input on human rights impact assessment.</li>
                <li><strong>Advancing openness through international organizations:</strong> OCF served as a user research and consultation partner for the Open Knowledge Foundation's Open Data Editor, sharing local advocacy experience.</li>
              </ul>
            </section>
            <section>
              <h3>Bringing open courses to campus and training future digital citizens</h3>
              <p>Open culture should not stop at technical communities. It should become basic cross-disciplinary literacy and part of capacity building for public agencies and nonprofit organizations.</p>
              <ul>
                <li><strong>Spreading open source into schools:</strong> Through a mix of topics and venues, OCF delivered six lectures at Soochow University, National Taipei University, National Yang Ming Chiao Tung University, and other campuses, covering open data, AI digital creation, digital rights, and social responsibility.</li>
                <li><strong>Basic literacy for digital citizenship:</strong> OCF shared global trends in digital public goods at the National Museum of Taiwan History and helped Hong Kong Outlanders learn how to use AI responsibly for public expression.</li>
              </ul>
            </section>
            <section>
              <h3>Repairing data quality: civic tech in practice</h3>
              <p>Open data must be useful, not merely available. OCF worked with the Aimosheng Foundation（愛陌生協會） to <a href="https://ocf.tw/story/epaper/2025/202511news/aed/">improve the quality of AED open data</a> through civic tech, so high-quality open data can truly save lives when it matters.</p>
            </section>
          </div>

