    title: 05 Open Community Building
    description:
  - type: content
    single_column: true
    columns:
      - type: article
        alignment: left
        title: Technology Changes, but Community Spirit Carries On
        description: |
          <p>Since its founding in 2014, OCF has served Taiwan's open-source communities by supporting administration and finance so communities can focus on their own development. Through talent cultivation, educational innovation, and cross-disciplinary experiments, OCF also expands the influence of Taiwan's open-source communities.</p>
          <div class="ocf2025-detail-grid">
            <section>
              <h3>Advancing the <a href="https://ocf.tw/p/oscvpass/">OSCVPass</a> project for open-source talent</h3>
              <p>Building on long-term analysis of open-source contributors, OCF was invited to work with the Administration for Digital Industries and the Institute for Information Industry on an AI technology meetup pilot for open-source mentorship. The pilot reviewed open-source contributions in AI-related technical communities and explored sustainable ways to support industry-relevant open-source talent.</p>
              <p>OCF also established OSCVPass, a fast-track feedback mechanism that offers priority entry or ticket discounts to long-term open-source contributors at major conferences such as SITCON and COSCUP. It is more than a ticket. It is practical respect for the spirit of collaboration.</p>
            </section>
            <section>
              <h3><a href="https://ocf.tw/p/openstarter/">OpenStarTer Village</a> reaches broader education settings</h3>
              <p>OCF independently developed the open-source education board game OpenStarTer Village, turning complex open-source project concepts and collaboration processes into a playable experience. It is paired with learning sheets on terms of use and practical activities on open data for AI. After continuous course refinement, the board game and lesson plans were selected for CommonWealth Parenting's 2025 Education Innovation 100.</p>
              <p>This year, OCF brought open technology concepts to National Taiwan Normal University, National Kaohsiung Normal University, and junior college campuses through four in-depth interactive workshops. The Japanese community Code for Japan also forked a Japanese edition and launched crowdfunding, bringing Taiwan's open-source education experience to the international stage.</p>
            </section>
            <section>
              <h3>Cross-cultural experiments in sharing: from <a href="https://ocf.tw/story/epaper/2025/202509news/jja-music/">Bioerosion to Sun Moon Darkness</a></h3>
              <p>Through openly licensed music, OCF shows that open culture is not limited to information technology. It can also help music, images, and other creative fields flourish. In 2024, OCF worked with Lim Giong and Luca Bonaccorsi to release the album <em>Bioerosion</em> under CC BY-SA 4.0. In 2025, OCF launched crowdfunding for a second CC-licensed album, <em>Sun Moon Darkness</em>, with Mong Tong and XTRUX.</p>
              <p><a href="https://ocf.tw/p/ccalbum/">The album's audio and source materials are fully open under public licenses</a>. Anyone can freely remix, sample, and even use them commercially with attribution, returning musical sovereignty to the public.</p>
            </section>
            <section>
              <h3>Twenty years of continuity: COSCUP 20th anniversary open-source policy track</h3>
              <p>At COSCUP, Taiwan's flagship open-source community conference, OCF curated an open-source policy track with nine sessions, including Fast Healthcare Interoperability Resources and the TaipeiPASS app, discussing how open-source-related government policy affects citizens in practice.</p>
            </section>
          </div>

