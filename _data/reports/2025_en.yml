  - type: content
    single_column: true
    columns:
      - type: article
        alignment: left
        title: Notes
        description: |
          <div class="ocf2025-note"><p>If I compare this to school life, OCF feels like a student council for the digital world. They support the open-source ecosystem, use an easy-to-understand board game like OpenStarTer Village to welcome newcomers, help people who do not write code understand open-source collaboration, and even work across art and music to help more people experience the open-source world.</p><p>It makes me feel that the digital world is not only cold technological competition. It is full of mutual support. Through the bridges OCF builds, we can solve problems together and meet all kinds of brilliant people beyond the screen.</p></div>

  - type: content
    single_column: true
    columns:
      - type: article
        alignment: left
        title: OCF Annual Milestones
        description: |
          <div class="ocf2025-metrics">
            <div><strong>700K</strong><span>Nearly 700,000 people reached through social media and newsletters</span></div>
            <div><strong>50+</strong><span>More than 50 events and talks organized</span></div>
            <div><strong>6</strong><span>Six international trips and participation in more than 30 domestic policy and international conference meetings</span></div>
            <div><strong>46</strong><span>46 Taiwan-based open-source communities supported</span></div>
          </div>
        items:
          - month: 2
            title: |
              <div class="ocf2025-timeline-entry">
              <p><span class="ocf2025-timeline-topic">RightsCon 2025</span> OCF served as a local partner for the world's largest human rights and digital issues conference, helping bring it to Taiwan for the first time and connecting 3,000 international advocates. During RightsCon, OCF hosted two satellite events, joined one official session, and co-hosted a booth with three Taiwanese organizations.</p>
              <p><span class="ocf2025-timeline-topic">Joint statement on digital rights</span> OCF joined civic groups to raise nine demands, including legal protections for digital rights, personal data protection, and broader adoption of open-source software, bringing open source and civic tech into law and policymaking as core strategies for public services and digital development.</p>
              </div>
          - month: 3
            title: |
              <div class="ocf2025-timeline-entry">
              <p><span class="ocf2025-timeline-topic">Open Technology Meetup</span> OCF tracked the development of open government commitments, discussed difficulties in public-sector data release, and explored how communities and public agencies can collaborate on high-quality open data.</p>
              </div>
          - month: 4
            title: |
              <div class="ocf2025-timeline-entry">
              <p><span class="ocf2025-timeline-topic">Traditional Chinese edition of the Good Governance Initiative handbook released</span> Through this translation, OCF systematically promoted the concept of OSPOs and helped companies and governments improve open-source software management and address supply-chain risks.</p>
              </div>
          - month: 5
            title: |
              <div class="ocf2025-timeline-entry">
              <p><span class="ocf2025-timeline-topic">OpenStarTer Village wins education innovation recognition</span> Supported by FNF Taiwan/Global Innovation Hub and developed by OCF with volunteers, the board game OpenStarTer Village and its lesson plans were selected for CommonWealth Parenting's 2025 Education Innovation 100, bringing open technology into schools and gaining recognition in mainstream education.</p>
              </div>
          - month: 6
            title: |
              <div class="ocf2025-timeline-entry">
              <p><span class="ocf2025-timeline-topic">Opt-out right for the National Health Insurance database</span> After ten years of litigation, a case long followed by OCF and partner organizations succeeded. People can now apply to withhold related personal health data from academic research use.</p>
              <p><span class="ocf2025-timeline-topic">Expanded discussions on internet freedom</span> The event “The Cost of E-Cigarette Control: Taiwan's Freedom of Expression Online?” brought together government agencies, legal experts, and civic organizations. More than 70 participants discussed how incomplete legal amendments and supporting measures led platforms to expand keyword review and seriously affected people's freedom of expression online.</p>
              </div>
          - month: 7
            title: |
              <div class="ocf2025-timeline-entry">
              <p><span class="ocf2025-timeline-topic">Observing data legislation</span> OCF published an in-depth article on the open data draft law, “Ten Years to Shape a Law: Open Data Is Still on the Road,” analyzing the draft Act for Promoting Data Innovation and Use and the unfinished work ahead, with attention to balancing openness and privacy.</p>
              </div>
          - month: 8
            title: |
              <div class="ocf2025-timeline-entry">
              <p><span class="ocf2025-timeline-topic">COSCUP track and workshops</span> At COSCUP, an open-source conference with more than 2,000 participants, OCF hosted the open-source policy track, a European open-source policy observation session, anonymity network workshops, and other activities to keep promoting open-source ideas.</p>
              <p><span class="ocf2025-timeline-topic">2025 TMEX International Forum</span> OCF CEO Lee Shin-Ying, Taiwanese electronic musician Lim Giong, Italian audiovisual artist Luca Bonaccorsi, and XTRUX director Tsai Hung-Hsien spoke on “Liberating the Future of Creation: From Open Co-Creation to AI Art,” sharing practical experience and future perspectives on open-source technology, public licensing, and AI creation.</p>
              <p><span class="ocf2025-timeline-topic">Jam Jam Asia music festival</span> Lim Giong and several music creators used CC-licensed materials from <em>Bioerosion</em> in the SUB overnight special program, bringing open-source spirit into JJA and attracting more than 1,700 audience members.</p>
              </div>
          - month: 9
            title: |
              <div class="ocf2025-timeline-entry">
              <p><span class="ocf2025-timeline-topic">Joining the OSPO Alliance</span> OCF officially became a member of the alliance, the first organization in Taiwan to join, strengthening international open-source governance networks.</p>
              <p><span class="ocf2025-timeline-topic">The next step for open parliament</span> OCF worked with the Westminster Foundation for Democracy (WFD) at the Legislative Yuan to release the Traditional Chinese edition of guidelines for parliamentary use of AI. OCF also reconnected previous open parliament stakeholders through a closed-door discussion on the next step for open parliament.</p>
              </div>
          - month: 10
            title: |
              <div class="ocf2025-timeline-entry">
              <p><span class="ocf2025-timeline-topic">Supporting Cathay Financial Holdings' Cathay Open Source Meetup</span> OCF helped invite Cloud Native Computing Foundation CTO Chris Aniszczyk to Taiwan, introducing Taiwan's open-source ecosystem and communities and discussing possibilities for corporate open source.</p>
              </div>
          - month: 11
            title: |
              <div class="ocf2025-timeline-entry">
              <p><span class="ocf2025-timeline-topic">Three demands for the human rights action plan</span> After the suspension of the Digital Intermediary Services Act, Taiwan lacked a unified policy framework for intervening in and managing online content. OCF joined an Executive Yuan Human Rights Action Plan briefing and called for a multi-stakeholder mechanism, inter-ministerial coordination, and clear transparency and accountability obligations for government agencies.</p>
              <p><span class="ocf2025-timeline-topic">Open Source Festival returns</span> At Taipei Music Center, OCF organized a special performance for Mong Tong's publicly licensed album <em>Sun Moon Darkness</em>. After Lim Giong's <em>Bioerosion</em>, OCF again used open music to continue the momentum around freely reusable public materials.</p>
              </div>
          - month: 12
            title: |
              <div class="ocf2025-timeline-entry">
              <p><span class="ocf2025-timeline-topic">From Open Data to AI-Ready Data: International Practices</span> OCF and FNF Taiwan/Global Innovation Hub collaborated on the “From Open Data to AI-Ready Data” study, interviewing five international cases and documenting practical approaches to open data in the AI era. A webinar brought the research into conversation with two cases from Taiwan, opening dialogue among government, communities, and industry on open data governance.</p>
              </div>

  - type: content
    single_column: true
    columns:
      - type: article
        alignment: left
        title: Community Partner Milestones
        description: |
          <p>OCF was founded to support Taiwan's open-source communities. We continue to believe that openness and collaboration are the forces that move society forward.</p>
          <p>In 2025, we were fortunate to work with more than 46 communities and witness partners deepen their work and practice their ideals in their own fields. This timeline records some of our community partners' notable achievements in 2025. Together, they show the creativity of Taiwan's open-source ecosystem.</p>
          <div class="ocf2025-detail-grid">
            <section><h3>Taiwan BSD Community</h3><ul><li>The internship program trained students to participate in the FreeBSD project. Student Sheng-Yi Hung became a committer and published a paper.</li><li>Two members, Yen-Hao Wang and Chun-Cheng Yeh, had papers accepted for presentation at AsiaBSDCon 2026.</li></ul></section>
            <section><h3>Creative Commons Taiwan</h3><ul><li>Published 12 Creative Commons articles and commentaries and joined 12 AI expert meetings at the Ministry of Digital Affairs and other agencies.</li><li>Promoted CC's recommendations for public-private collaboration in the generative AI era, helping local audiences understand public-interest and respect mechanisms such as CC Signals.</li></ul></section>
            <section><h3>Cloud Native Taiwan User Group</h3><ul><li>Kubernetes Community Days Taipei brought together more than 100 participants.</li></ul></section>
            <section><h3>Cofacts</h3><ul><li>Held six fact-checking collaboration trainings with 132 total participants. The series has now reached 50 events and remains open for participation.</li></ul></section>
            <section><h3>COSCUP</h3><ul><li>Co-organized the conference with RubyConf TW, attracting more than 3,200 participants, 48 international speakers, and 17 international booths to Taiwan.</li><li>Visited FOSDEM, FOSSASIA, OSC Nagoya, and other international conferences for in-person exchange, and was listed by the Open Source Initiative among the top 50 open-source conferences.</li></ul></section>
            <section><h3>g0v jothon</h3><ul><li>Held six hackathons, one Dark Magic Defense hackathon, and four court observation hackathons.</li><li>g0v School marked its fifth anniversary and launched a digital empowerment curriculum.</li></ul></section>
            <section><h3>Hsinchu Coding Serfs Meetup (HCSM)</h3><ul><li>The community came back to life.</li><li>Co-organized World RISC-V Day with RISC-V@Taiwan and NYCU Software Developer Club, with more than 200 participants.</li></ul></section>
            <section><h3>JCConf Taiwan</h3><ul><li>For Java's 30th anniversary, JCConf focused on Java 25 LTS, attracting more than 450 developers and 10 companies, with over 30 sessions covering AI Agent implementation, cross-platform KMP strategies, next-generation GC tuning, and more.</li></ul></section>
            <section><h3>OpenStreetMap Taiwan</h3><ul><li>Continued monthly OpenStreetMap x Wikidata Taipei meetups.</li></ul></section>
            <section><h3>PyCon Taiwan</h3><ul><li>Expanded to five tracks and launched the Young Inspires forum, increasing participation among younger generations and reaching the largest scale in the conference's history.</li></ul></section>
            <section><h3>PyLadies Kaohsiung</h3><ul><li>Held Python beginner workshops in northern and southern Taiwan, creating women-centered spaces for programming and AI-assisted coding.</li></ul></section>
            <section><h3>Ruby Taiwan</h3><ul><li>Co-organized the annual conference with COSCUP and invited Ruby creator Yukihiro Matsumoto and the mayor of Matsue to participate.</li></ul></section>
            <section><h3>sciwork</h3><ul><li>Held monthly scisprint development sprints, plus a mid-year seminar and year-end conference, catalyzing cross-disciplinary technical exchange and community development.</li></ul></section>
            <section><h3>SITCON</h3><ul><li>SITCON continued bringing student volunteers and contributors together to organize events and invest in the community, attracting more than 1,200 participants to the annual conference.</li></ul></section>
            <section><h3>System Software Goes Global</h3><ul><li>Participated in Open Source Summit North America, presenting three sessions on the work of eight young contributors, including RISC-V, machine learning performance, and Valkey multithreading.</li></ul></section>
            <section><h3>vTaiwan</h3><ul><li>Worked with TWNIC on a dynamic deliberation model using AI verification to prevent fraud.</li><li>Published AI deliberation research with Google Jigsaw and People Powered, and held 50 Wednesday meetups and Facing the Ocean hackathons.</li></ul></section>
            <section><h3>Mozilla Taiwan Community</h3><ul><li>Held 197 events with 1,702 participants, including more than 200 first-time visitors.</li></ul></section>
            <section><h3>Twinkle AI</h3><ul><li>Worked with APMIC and the National Center for High-performance Computing to build the first compact reasoning model, F1, and release the corresponding reasoning dataset.</li><li>Built a textbook-quality Traditional Chinese pretraining corpus with Taiwan Mobile and released the next-generation T1-4B model, setting a new milestone for the Traditional Chinese AI ecosystem.</li></ul></section>
            <section><h3>FreeSEED</h3><ul><li>Open-sourced the gpt-oss-120b model supporting Traditional Chinese reasoning.</li></ul></section>
            <section><h3>Taiwan Network Operators' Group (TWNOG)</h3><ul><li>Focused the year on strengthening network resilience and security, exploring RPKI deployment, DDoS protection, and network automation to support a more stable and secure Taiwan internet interconnection ecosystem.</li></ul></section>
            <section><h3>opensource4you</h3><ul><li>Became Taiwan's first official chapter of the Apache Software Foundation (ASF), contributing thousands of commits and becoming a core organization for multiple international open-source technologies.</li><li>Received recognition from the mayor, while the community reached more than 550,000 monthly reads and over 30,000 discussions.</li></ul></section>
            <section><h3>WordCamp Taiwan</h3><ul><li>Held the annual conference in Kaohsiung for the first time, bringing together more than 250 open-source enthusiasts to discuss website building, design, and content marketing trends.</li></ul></section>
            <section><h3>Guangfu Volunteers</h3><ul><li>Since the Matai'an incident, the community independently developed information systems that integrated volunteer maps and supply matching to improve collaboration efficiency in disaster areas.</li></ul></section>
          </div>

  - type: content
    single_column: true
    columns:
      - type: article
        alignment: left
        title: Global Connections
        description: |
          <p>In 2025, OCF continued bringing Taiwan's experience to the world and bringing global trends in open technology, digital rights, and internet freedom back to Taiwan.</p>
          <section class="ocf2025-world-map" aria-label="World map of OCF's 2025 global connections">
            <figure class="ocf2025-world-map-figure"><img src="/p/2025/en/images/international-map-accurate.svg" alt="World map of OCF's 2025 global connections, marking Taiwan, Belgium, Portugal, South Korea, Thailand, Malaysia, and connecting routes"></figure>
            <div class="ocf2025-world-map-cards">
              <article class="ocf2025-world-card taiwan"><span>Taiwan</span><p>In February, during the RightsCon session “The Watchful Eyes of Civic Community: Taiwan's Digital Security Support from Personal to Regional Practices,” OCF invited four civic representatives to discuss practical solutions for human rights defenders in East Asia facing increasingly severe digital threats.</p><p>OCF co-hosted two RightsCon satellite events: “Mutual Aid, Resonance, and Amplification: Digital Rights Voices from Taiwan and East Asia” and a discussion with domestic and international experts on digital privacy policy and digital gender-based violence. At the internet freedom, censorship, and anonymity workshop, OCF invited Tor, Tails, and OONI to share global network measurement practices and ways to bypass internet censorship.</p><p>OCF invited three Taiwanese groups, Citizen Congress Watch, Doublethink Lab, and Taiwan Equality Campaign, to co-host a three-day booth at the RightsCon Community Village, sharing work on technology and digital issues and showing the energy of civil society.</p></article>
              <article class="ocf2025-world-card korea"><span>South Korea</span><p>In September, OCF attended the Global Privacy Assembly in Seoul and shared Taiwan's civic community contributions to privacy and digital rights protection at the forum “Advancing Asia-Pacific Digital Consumer Dialogue.”</p></article>
              <article class="ocf2025-world-card belgium"><span>Belgium</span><p>In February, OCF traveled to Brussels for FOSDEM, sharing Taiwan's community collaboration model and tools such as OSCVPass and OPASS with global open-source advocates through booths, sessions, and lightning talks.</p></article>
              <article class="ocf2025-world-card portugal"><span>Portugal</span><p>In September, OCF joined international partners working on digital technology and human rights at Global Gathering, continuing to share Taiwan's digital rights advocacy efforts and help Taiwan's experience contribute to the international community.</p></article>
              <article class="ocf2025-world-card thailand"><span>Thailand</span><p>In November, OCF joined International Civil Society Week hosted by CIVICUS to discuss strategies for defending democracy in the Asia-Pacific region amid expanding digital authoritarianism and shrinking civic space.</p><p>Also in November, OCF was invited to Bangkok for the Asia Democracy Assembly, where it shared Taiwanese civic groups' experiences with cross-border digital attacks and OCF's proposed defense strategies with civil society leaders, policymakers, and international partners from across Asia.</p></article>
              <article class="ocf2025-world-card malaysia"><span>Malaysia</span><p>In May, OCF joined the Digital Rights Asia-Pacific Assembly (DRAPAC) hosted by EngageMedia in Kuala Lumpur, introduced its Digital Security Support Program for civil society groups at Open Tech Camp, and held in-depth exchanges with security trainers from different countries on supporting human rights defenders more effectively in high-risk environments.</p></article>
            </div>
          </section>

