    title: 01 Open Technology
    description:
  - type: content
    single_column: true
    columns:
      - type: article
        alignment: left
        title: Open Source Is Public Infrastructure for the Digital World
        description: |
          <p>In the digital world, the software and services we use every day are like the foundation of a building. OCF's work on open technology this year focused on making sure that foundation remains reliable, secure, public-minded, and not captured by monopolies.</p>
          <div class="ocf2025-detail-grid">
            <section>
              <h3>Guardians of the software supply chain: advancing OSPO governance and international coordination</h3>
              <p>Open-source software sits at the core of how governments and companies operate. Using it well and managing it responsibly requires practical knowledge. This year, OCF turned complex governance ideas into tools that organizations can actually use.</p>
              <ul>
                <li><strong><a href="https://ocf.tw/story/ospos-1-join-OSPO-alliance/">Taiwan's first member of the OSPO Alliance</a>:</strong> OCF became the first organization in Taiwan to join the OSPO Alliance, bringing global open-source governance experience into local practice.</li>
                <li><strong>Publishing governance resources and preserving digital assets:</strong> OCF <a href="https://dub.sh/OSPO-GGI-ZHTW">translated and released the Traditional Chinese edition of the Good Governance Initiative handbook</a>, and helped preserve digital assets from the Open Source Software Foundry (OSSF) and Creative Commons Taiwan (CCTW) by <a href="https://github.com/ocftw">backing them up to OCF's GitHub page</a>.</li>
                <li><strong><a href="https://ocf.neticrm.tw/civicrm/mailing/view?reset=1&id=382">Visiting FOSDEM and tracking the Cyber Resilience Act</a>:</strong> OCF attended FOSDEM, Europe's largest open-source conference, for the third time, bringing Taiwan's experience to the international community and following how the Cyber Resilience Act (CRA) affects open-source compliance.</li>
              </ul>
            </section>
            <section>
              <h3>Gatekeepers of digital sovereignty: <a href="https://ocf.tw/p/pmpc/">Public Money, Public Code (PMPC)</a> and local implementation</h3>
              <p>OCF has long advocated for open source and worked to make it practical inside government agencies, so code serving the public interest can truly be governed by the public and its democratic institutions.</p>
              <ul>
                <li><strong>Helping Taipei City Government develop open-source adoption assessment guidelines:</strong> OCF carried out two open-source alternative assessments for server virtualization and database software, accelerating public-sector adoption of open-source solutions.</li>
                <li><strong>Localizing international standards:</strong> OCF completed the Traditional Chinese translation of Standard for Public Code version 0.8.1, helping Taiwan's Public Code work align with international technical standards.</li>
                <li><strong>Working with the Ministry of Digital Affairs to build policy dialogue:</strong> OCF helped organize four working group meetings on the ministry's Public Code commitments, bringing civic communities, technology companies, and government officials together to discuss the next steps for public-interest software.</li>
              </ul>
            </section>
          </div>

