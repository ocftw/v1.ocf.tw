      - type: article
        alignment: left
        title: Hi, I'm Glad We Met Here
        subtitle: A few thoughts about the world we live in
        description: |
          <p>Growing up in Taiwan, I saw more and more of life turn into combinations of 0s and 1s. We chat on social media, shop online, search the web for knowledge, and now handle all kinds of daily errands through screens. As I grew older, I saw that the physical world has long-established laws and social systems that quietly maintain and adjust its order. The digital world we inhabit feels much younger, almost as young as I am, and still uncertain in many ways.</p>
          <p>I do not want the digital world of the future to become a giant black box filled with invisible surveillance and manipulation. The future I hope for is transparent, open to public debate, and written by everyone who lives in it.</p>
          <p>The bridge to that digital world is still being built, and it needs more people paying attention. So please follow my point of view and see how the Open Culture Foundation has fought for the digital freedom of my generation this year.</p>

  - type: content
    columns:
      - type: article
        alignment: left
        title: Running a Relay With Developers Around the World
        description: |
          <div class="ocf2025-story">
          <p class="ocf2025-story-lead">I first learned about OCF and its work because I wanted a hot bowl of braised pork rice from the school co-op.</p>
          <p>We are already a quarter of the way through the twenty-first century, and my school co-op still does not have an online meal-ordering system. Every lunchtime, everyone waits in line, and by the time we get our lunch, half of the break is gone. Facing the same awkward situation day after day, I suddenly wondered: after all those computer classes, why not write an ordering app everyone could use?</p>
          <p>I hit a wall almost as soon as I started. Payment flows and authentication systems were far beyond the level of a sixteen-year-old student. Then I opened GitHub and stepped into the world of open source. There, I found an ordering system template shared by a senior student. The best part was that it was not locked behind “all rights reserved.” It welcomed reuse and collaboration.</p>
          <p>I stood on someone else's shoulders, modified the code for my school, and even sent my version back to GitHub to help another student club. At that moment I understood something important: when technology is not locked inside a black box, we do not have to rebuild everything from scratch. This must be the “collaboration” OCF keeps talking about. It felt like running a relay with developers online, where my contribution could become the next person's foothold. Open source is public infrastructure for the digital world.</p>
          <p>If a high school student can use open-source ideas to solve a lunch problem on campus, what about the wider society? What digital bridges did OCF build this year through open technology, including open source, open data, and open government?</p>
          </div>
