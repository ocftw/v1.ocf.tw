        title: Notes
        description: |
          <div class="ocf2025-note"><p>When the internet goes down, it affects much more than streaming shows or scrolling on a phone. Basic needs can also run into trouble. Seeing OCF discuss backup mechanisms for outages made me realize how fragile the internet really is.</p><p>Over the past year, I saw OCF partners travel around the world to exchange Taiwan's work and experience in internet freedom and digital rights with experts. In Taiwan, where internet access feels as constant as oxygen, internet freedom is still not a familiar issue for many people. Continued advocacy and discussion can help more people notice potential risks and start looking for solutions earlier.</p></div>

  - type: content
    columns:
      - type: article
        alignment: left
        title: Alone You Go Fast, Together You Go Far
        description: |
          <div class="ocf2025-story">
          <p class="ocf2025-story-lead">A semester passed quickly. My ordering system became popular at school and even caught the attention of other schools.</p>
          <p>OCF invited me to bring the project to an international open-source conference. There, I met young developers from different countries. Some used open hardware to solve water supply problems in Africa. Others worked on digital voting systems in Europe. Standing among people who cared about similar things, I realized I was no longer the girl sitting alone in front of a screen, feeling powerless before a huge system. When we gather our experience and code, community energy can carry us farther.</p>
          <p>At those exchanges, we shared the digital challenges we faced and felt the steady momentum of open-source communities. I think this is why OCF works so hard on community building. They are not only promoting technology. They are weaving a vast network of support.</p>
          <p>Through visits and international exchange, OCF connects Taiwan's open-source energy with the world. I finally understand that the key to a better digital future is passed among communities willing to share knowledge and collaborate. One person may move quickly, but a group of friends with a shared purpose can go much farther.</p>
          </div>
