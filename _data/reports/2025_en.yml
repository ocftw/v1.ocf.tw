      - type: article
        alignment: left
        title: Notes
        description: |
          <div class="ocf2025-note"><p>I used to think “open source” just meant people getting together to write free software. After reading OCF's Good Governance Initiative handbook and learning about Public Code, I realized that open source is also a movement about rights.</p><p>If government code is not transparent, we cannot oversee it. If human rights groups lack secure open-source tools and basic digital security guidance, people will have a harder time speaking up. OCF is like a bridge builder in the digital world, making sure every stone under our feet is transparent and safe.</p></div>

  - type: content
    columns:
      - type: article
        alignment: left
        title: I Want to Know What We Are Eating
        description: |
          <div class="ocf2025-story">
          <p class="ocf2025-story-lead">My ordering app officially launched. My classmates loved it, and the school even gave me a minor merit award.</p>
          <p>As more people bought meals from the co-op, I started to wonder why some dishes always sold out and whether the ingredients were really safe. I asked the school for three years of food procurement data, hoping to turn it into charts that everyone could review. The student affairs director said the data was internal and unavailable for public release. In the end, I only received a PDF that was hard to analyze with code.</p>
          <p>That was the first time I felt the frustration of opaque data and understood why open data matters. If even school co-op data is this hard to get, or if the data arrives in a format that machines cannot read, how can ordinary people see the full picture of government budgets, environmental monitoring data, or the progress of legislation?</p>
          <p>Only then did I understand why OCF works on open data and open government in addition to open source. Non-sensitive data related to daily life should not be a secret locked away on a public-sector hard drive. Every citizen should have the right to access and oversee it. Without transparent data, “public participation” becomes a blind search through fog.</p>
          <p>So I decided to keep going and use OCF's advocacy methods and communication strategies to knock on the door to the truth.</p>
          </div>
