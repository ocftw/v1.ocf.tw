      - type: article
        alignment: left
        title: Notes
        description: |
          <div class="ocf2025-note"><p>Digital security is not only about avoiding suspicious links, and digital rights are not limited to whether the police abuse their power. Through OCF's participation in these international conferences, I learned that digital rights touch almost every corner of modern life.</p><p>Many of these issues do not happen only in Taiwan. OCF went to Malaysia, South Korea, and Portugal to share Taiwan's cases and bring back digital defense experience from abroad. They made me feel that even though digital authoritarianism looks enormous, we are not alone as long as people keep defending this line.</p></div>

  - type: content
    columns:
      - type: article
        alignment: left
        title: The Blood Vessels of the Digital World
        description: |
          <div class="ocf2025-story">
          <p class="ocf2025-story-lead">One ordinary afternoon, while the whole school was voting on next week's menu, the internet suddenly became painfully slow.</p>
          <p>It was not only our school. The entire area was experiencing unusual lag. At first, I thought the telecom provider had a short outage. Then I checked the news and was shocked to learn that a major disconnection could also be caused by a break in submarine cables. Matsu experienced submarine cable breaks a few years ago, bringing serious inconvenience to local residents. If cables around Taiwan deteriorated or were damaged, the impact would be hard to imagine.</p>
          <p>That unexpected outage made me realize how important the internet is to life for my generation, and that a smooth connection is not guaranteed. I thought of OCF's work on internet freedom. Democratic Taiwan currently faces relatively little internet censorship or deliberate shutdowns by the government compared with some countries, but as an island, Taiwan's resilience remains fragile. If submarine cables or base stations are disrupted, or if geopolitical conflict cuts them off, our everyday digital lives could be forced to stop.</p>
          <p>Internet freedom includes the freedom to connect, speak, and avoid censorship. I finally understood why OCF pays attention to both internet freedom and infrastructure. They are protecting freedom of expression on our screens and the submarine cables that keep a democratic society running. Without an open and functioning internet, all the ideals we build could be washed away by a single wave.</p>
          </div>
      - type: article
        alignment: center
        title:
        description: |
