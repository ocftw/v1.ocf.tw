        title: To Citizens of the Digital Age
        description: |
          <div class="ocf2025-letter">
          <p>Digital technology is reshaping how each of us lives, thinks, and exercises our rights.</p>
          <p>We invite you to look at the most urgent questions of our time through the eyes of a sixteen-year-old girl. The openness, freedom, transparency, and participation we have fought for are being hidden behind opaque code and algorithms. We seem to move freely through the digital world, yet our privacy, preferences, and even possible futures are increasingly defined by technical rules written by a small number of people.</p>
          <p>The Open Culture Foundation (OCF) exists so that the rules governing technology can be put back in the hands of every digital citizen.</p>
          <p>Over the past year, we have put openness into practice on the front lines. We promoted the idea of Public Code, urging government agencies to adopt open-source software and avoid vendor lock-in. Through the Open Tech Garage and our digital security support program, we helped civil society build stronger defenses. We also joined discussions on digital rights legislation, so privacy and freedom would not become the price of technological progress.</p>
          <p>As the rise of AI sharpened debates over training data, safety, and privacy, OCF went to the Legislative Yuan to help advance guidelines for parliamentary use of AI. We also joined multiple Ministry of Digital Affairs meetings on responsible government use of AI, personal data protection, and creators' rights. We believe transparency and sharing offer the best path through today's digital problems. AI should serve society as a public good, not grow into a tool without accountability.</p>
          <p>OCF works toward a genuinely open and transparent digital future. In that future, open-source code, open data, and open government allow everyone to participate as equals and defend their own rights. We sincerely invite you to stand with OCF, help us build better digital lives, and keep the power to decide the future firmly in people's hands.</p>
          <p class="ocf2025-signature ocf2025-signature-en"><img src="/p/2025/images/signature-en.png" alt="Signature of the Chief Executive Officer"></p>
          </div>

  - type: content
