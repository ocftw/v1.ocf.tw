  - type: header
    anchor: digital-rights
    theme: light
    color:
    icon: shield alternate
    title: 03 Digital Rights
    description:
  - type: content
    single_column: true
    columns:
      - type: article
        alignment: left
        title: Freedom in the Digital World Is Not Guaranteed
        description: |
          <p>Over the past year, OCF protected citizens' privacy and freedom of expression through international engagement and local community work.</p>
          <div class="ocf2025-detail-grid">
            <section>
              <h3>The digital front line of international advocacy: bringing Taiwan's experience to the world</h3>
              <p>Threats to digital rights are global. OCF joined major international gatherings to make sure Taiwan has a place in digital governance conversations across the Asia-Pacific region and beyond.</p>
              <ul>
                <li><strong>Digital Rights Asia-Pacific Assembly (DRAPAC):</strong> In Kuala Lumpur, OCF introduced its 12-month digital security support program and exchanged experience with international partners working on digital rights and technology, discussing how to support advocates in high-risk environments.</li>
                <li><strong>Global Privacy Assembly (GPA):</strong> At a forum in Seoul, OCF shared Taiwan's civic community contributions to privacy and digital rights protection.</li>
                <li><strong>Asia Democracy Assembly:</strong> At one of Asia's most influential democracy gatherings, OCF analyzed Taiwan's defense strategies against cross-border digital attacks and examined authoritarian tactics.</li>
                <li><strong>Global Gathering:</strong> In Portugal, OCF connected Taiwanese and global digital rights organizations and practitioners, exchanging the latest trends in digital rights in Taiwan and around the world.</li>
              </ul>
            </section>
            <section>
              <h3>RightsCon 2025 came to Taiwan for the first time</h3>
              <p>In 2025, <a href="https://ocf.tw/p/rightscon2025/">RightsCon</a>, the global digital rights conference hosted by Access Now, came to Taiwan for four days at the Taipei International Convention Center. As the local partner for RightsCon 2025, OCF worked directly with developers and researchers from around the world and connected Taiwanese NGOs to identify human rights strategies that can be put into practice.</p>
              <ul>
                <li><strong>Workshops on internet freedom, censorship, and anonymity:</strong> During RightsCon, OCF organized an internet freedom workshop and invited Tor Browser, the privacy-focused operating system Tails, and the global network measurement organization OONI to Taiwan. Taiwanese developers were able to exchange directly with international teams on detecting network blocking, resisting digital surveillance, and keeping information flows from being maliciously disrupted.</li>
                <li><strong><a href="https://ocf.tw/en/p/rightscon2025/joint-statement/">Nine demands with civil society partners</a>:</strong> OCF joined the Judicial Reform Foundation, Taiwan Association for Human Rights, Amnesty International Taiwan, and other civic groups to issue a joint statement with nine core demands on AI governance and digital rights, urging the government to follow through on openness and transparency under international attention.</li>
              </ul>
            </section>
            <section>
              <h3><a href="https://ocf.tw/p/defendhrd/">Digital Security Support Program</a>: defenders should not stand alone</h3>
              <p>Civil society organizations (CSOs) and human rights defenders (HRDs) are often targets of cross-border digital attacks by authoritarian governments. To keep organizations from facing malicious threats alone, OCF launched the Digital Security Support Program in 2024, offering one year of practical support to strengthen the digital defenses of CSOs and HRDs.</p>
              <ul>
                <li><strong>Sharing real attack cases:</strong> OCF invited security analysts from the Taiwan cybersecurity volunteer community CSCS to break down targeted phishing attacks discovered during the program, helping civil society learn from real incidents and defend against digital authoritarianism.</li>
                <li><strong>Cross-disciplinary dialogue:</strong> In the Open Source Security track co-organized by COSCUP and HITCON in 2025, OCF shared field observations from its work with civil society groups and helped match open-source technical capacity with CSO needs.</li>
              </ul>
            </section>
            <section>
              <h3>Fighting for key rights: law and governance under pressure</h3>
              <ul>
                <li><strong>The right to opt out of secondary use of National Health Insurance data:</strong> After ten years of litigation and advocacy, the opt-out mechanism for secondary use of the National Health Insurance database officially launched in August 2025, protecting people's right to decide how their health data is used.</li>
                <li><strong><a href="https://ocf.tw/story/epaper/2025/202511news/advrights/">Advocacy on the Executive Yuan Human Rights Action Plan</a>:</strong> OCF argued that digital rights protection needs more open and transparent public oversight. We proposed three demands, calling on the government to create multi-stakeholder participation mechanisms, strengthen inter-ministerial coordination, and govern the internet more transparently.</li>
              </ul>
            </section>
          </div>

