    title: 04 Internet Freedom
    description:
  - type: content
    single_column: true
    columns:
      - type: article
        alignment: left
        title: <a href="https://ocf.tw/p/infr/">Internet Freedom</a>
        description: |
          <p>As authoritarianism spreads through digital tools, internet freedom also includes network resilience and the freedom to speak without surveillance. OCF works to strengthen Taiwan's digital resilience and introduce open-source anti-censorship technologies and trends.</p>
          <div class="ocf2025-detail-grid">
            <section>
              <h3>Stress-testing digital resilience</h3>
              <p>Internet freedom is not abstract. Beneath the sea, submarine cables carry the traffic of the digital world, and their vulnerability has only recently become widely understood. This year, OCF continued to prepare for emergencies through monthly Internet Freedom Meetups, community discussions, and technical research.</p>
              <ul>
                <li><strong>Defending against large-scale outages:</strong> At Internet Freedom Meetups, OCF and experts discussed alternative communication options during major outages, including the Hermes Project's resilient communication technology and Winlink radio communication, so civil society can maintain basic rescue and information flows when submarine cables are damaged.</li>
                <li><strong>Learning from international experience:</strong> A discussion on national security and digital rights drew lessons from Ukraine's experience maintaining communications under conflict, and explored possible strategies for Taiwan.</li>
              </ul>
            </section>
            <section>
              <h3>Opposing digital censorship and defending freedom of expression</h3>
              <p>In response to legal amendments affecting user-generated content (UGC), OCF used Internet Freedom Meetups to bring experts, academics, civil society groups, and government agencies together to <a href="https://ocf.tw/story/epaper/2025/202511news/wiki-sue/">discuss possible solutions</a>. We also reminded society that better regulation needs broad discussion and complete implementation measures. Heavy-handed fines can create a chilling effect, push platforms toward broader pre-screening, and harm people's freedom of expression online.</p>
            </section>
          </div>

