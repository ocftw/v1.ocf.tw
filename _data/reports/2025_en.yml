    columns:
      - type: article
        alignment: left
        title: Notes
        description: |
          <div class="ocf2025-note"><p>I used to think open data simply meant putting files on a website. Later I learned that open data has requirements and quality standards. If formats are not machine-readable, or if the law does not clearly require government agencies to open data, people still cannot use it.</p><p>Seeing OCF go to the Legislative Yuan, the Executive Yuan, and university classrooms helped me understand that “openness” is a long-distance race against time. The work with the Aimosheng Foundation（愛陌生協會） to improve AED map data was especially cool to me. When data becomes transparent and accurate, it stops being a stiff file on a hard drive and becomes real support that can protect people.</p></div>

  - type: content
    columns:
      - type: article
        alignment: left
        title: Who Is Watching Me Behind the Algorithm?
        description: |
          <div class="ocf2025-story">
          <p class="ocf2025-story-lead">After months of communication and friction, the school's food data became more complete, and the app improved with advice from more experienced developers.</p>
          <p>Then, just as the ordering system became more popular, something chilling happened. I found out that a catering company with a long-term relationship with the school had written privately, hoping I would “authorize” them to use students' ordering preferences, allergy records, and even daily schedules as marketing data.</p>
          <p>Of course I refused. But the incident made me realize that in an age where everything is connected, every casual digital footprint and every everyday action converted into 0s and 1s can become a currency traded quietly between companies. Under the friendly surface of technological convenience, our privacy is becoming dangerously fragile.</p>
          <p>This is the digital rights front line OCF defends. In the shadow of pervasive commercial surveillance and possible AI abuse, we urgently need stronger rules that protect personal data and digital rights. I do not want the digital life of the future to trade on our personal information.</p>
          <p>That night, I checked the source code line by line and removed every unnecessary tracker. Protecting my classmates' personal data meant protecting their basic human dignity.</p>
          </div>
